name: CI

# Runs on push to main, on pull requests, and on manual "Run workflow".
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Basic checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          shopt -s nullglob
          found=0
          for f in scripts/*.sh; do
            found=1
            echo "Syntax check: $f"
            bash -n "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "No shell scripts found, skipping."
          fi

      - name: ShellCheck lint
        # Warnings only, does not fail the build (tutorial repo, this is a demo).
        continue-on-error: true
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=warning scripts/*.sh || true
          else
            echo "shellcheck not installed, skipping."
          fi

      - name: Confirm key files exist
        run: |
          for f in README.md LICENSE .gitignore docs/01-environment-setup.md; do
            if [ -f "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ missing $f"
              exit 1
            fi
          done
